[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions."daily-feed"]
  schedule = "5 6 * * *"

[functions."evening-recap"]
  schedule = "0 19 * * *"

[functions."live-check"]
  schedule = "*/10 6-10 * * 1-5"

[functions."call-reminders"]
  schedule = "*/5 * * * *"
