[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions."daily-feed"]
  schedule = "5 6 * * *"

[functions."evening-recap"]
  schedule = "0 19 * * *"

[functions."live-check"]
  schedule = "*/10 5-14 * * *"

[functions."call-reminders"]
  schedule = "*/5 * * * *"

[functions."task-reminders"]
  schedule = "0 * * * *"

[functions."extra-check"]
  schedule = "*/15 * * * *"

[functions."story-cleanup"]
  schedule = "30 3 * * *"

[functions."unseen-reminder"]
  schedule = "*/30 * * * *"
